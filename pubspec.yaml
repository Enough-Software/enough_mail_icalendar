homepage: https://github.com/Enough-Software/enough_mail_icalendar

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  collection: ^1.17.0
  enough_icalendar: ^0.17.0
  enough_mail: ^2.1.7

